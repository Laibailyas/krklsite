<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KRKL — Intelligence beyond limits begins</title>
  <meta name="description" content="KRKL builds high-end AI solutions: cyberpunk AI, agent-to-agent systems and fully custom builds.">
  <meta name="theme-color" content="#050f2a">
  <meta property="og:title" content="KRKL — Intelligence beyond limits begins">
  <meta property="og:description" content="High-end AI solutions. Building a more intelligent tomorrow together.">
  <link rel="icon" type="image/svg+xml" href="assets/krkltech-dark-icn.svg">

  <script>document.documentElement.className = 'js';</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" as="image" href="assets/hero-poster.jpg">
</head>
<body>
  <main class="stage">

    <!-- LEFT COLUMN -->
    <aside class="card card--side card--left">
      <img class="card__bg" src="assets/left-bg.jpg" alt="" width="793" height="1983" decoding="async">

      <a class="brand" href="./" aria-label="KRKL home">
        <img src="assets/krkltech-logo-white.svg" alt="KRKL" width="480" height="127">
      </a>

      <nav class="menu" aria-label="Solutions">
        <ol>
          <li>
            <a href="#cyberpunk-ai">
              <span class="num">01</span><span class="dash" aria-hidden="true"></span><span class="txt">Cyberpunk AI</span>
            </a>
          </li>
          <li>
            <a href="#agent-to-agent">
              <span class="num">02</span><span class="dash" aria-hidden="true"></span><span class="txt">Agent-to-agent</span>
            </a>
          </li>
          <li>
            <a href="#custom">
              <span class="num">03</span><span class="dash" aria-hidden="true"></span><span class="txt">Custom</span>
            </a>
          </li>
        </ol>
      </nav>
    </aside>

    <!-- CENTER COLUMN (video) -->
    <section class="card card--hero" aria-labelledby="hero-title">
      <video class="hero__video" autoplay muted loop playsinline preload="auto"
             poster="assets/hero-poster.jpg" aria-hidden="true" tabindex="-1">
        <source src="assets/hero.mp4" type="video/mp4">
        <source src="assets/hero.webm" type="video/webm">
      </video>
      <div class="hero__scrim" aria-hidden="true"></div>

      <div class="hero__copy">
        <p class="eyebrow">High–end AI solutions</p>
        <h1 id="hero-title">
          <span class="line">Intelligence</span>
          <span class="line">beyond limits</span>
          <span class="line line--accent">begins</span>
        </h1>
      </div>

      <a class="cta" href="#solutions">
        <span>Explore solutions</span>
        <svg viewBox="0 0 19 14" width="19" height="14" fill="none" aria-hidden="true">
          <path d="M0 7h17M11 1l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <button class="video-toggle" type="button" data-video-toggle aria-pressed="false" aria-label="Pause background video">
        <svg class="i-pause" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="1" width="3" height="10" rx="1" fill="currentColor"/><rect x="7" y="1" width="3" height="10" rx="1" fill="currentColor"/></svg>
        <svg class="i-play" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 1.2v9.6L10.5 6z" fill="currentColor"/></svg>
      </button>
    </section>

    <!-- RIGHT COLUMN -->
    <aside class="card card--side card--right">
      <img class="card__bg" src="assets/right-bg.jpg" alt="" width="324" height="1000" decoding="async">
      <p class="caption">
        <span>Building a more</span>
        <span>intelligent tomorrow</span>
        <span>together</span>
      </p>
    </aside>

  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
